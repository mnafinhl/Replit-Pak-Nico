openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session authentication
  - name: distros
    description: Linux distribution repository operations
  - name: dashboard
    description: Repository summary operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/me:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /distros:
    get:
      operationId: listDistros
      tags: [distros]
      summary: List Linux distributions
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Development, Active, Legacy]
      responses:
        "200":
          description: Distro records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Distro"
    post:
      operationId: createDistro
      tags: [distros]
      summary: Create a Linux distribution record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistroInput"
      responses:
        "201":
          description: Created distro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distro"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /distros/{id}:
    get:
      operationId: getDistro
      tags: [distros]
      summary: Get a Linux distribution record
      parameters:
        - $ref: "#/components/parameters/DistroId"
      responses:
        "200":
          description: Distro record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distro"
        "404":
          description: Distro not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateDistro
      tags: [distros]
      summary: Update a Linux distribution record
      parameters:
        - $ref: "#/components/parameters/DistroId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistroUpdate"
      responses:
        "200":
          description: Updated distro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distro"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDistro
      tags: [distros]
      summary: Delete a Linux distribution record
      parameters:
        - $ref: "#/components/parameters/DistroId"
      responses:
        "204":
          description: Deleted distro
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get repository summary
      responses:
        "200":
          description: Repository summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  parameters:
    DistroId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
      required: [id, username, role]
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    Distro:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        base:
          type: string
        kernel:
          type: string
        status:
          type: string
          enum: [Development, Active, Legacy]
        image:
          type: ["string", "null"]
        notes:
          type: string
        createdAt:
          type: string
      required: [id, name, base, kernel, status, image, notes, createdAt]
    DistroInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        base:
          type: string
          minLength: 1
        kernel:
          type: string
          minLength: 1
        status:
          type: string
          enum: [Development, Active, Legacy]
        image:
          type: ["string", "null"]
        notes:
          type: string
      required: [name, base, kernel, status, notes]
    DistroUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        base:
          type: string
          minLength: 1
        kernel:
          type: string
          minLength: 1
        status:
          type: string
          enum: [Development, Active, Legacy]
        image:
          type: ["string", "null"]
        notes:
          type: string
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        development:
          type: integer
        legacy:
          type: integer
        latest:
          type: array
          items:
            $ref: "#/components/schemas/Distro"
      required: [total, active, development, legacy, latest]

