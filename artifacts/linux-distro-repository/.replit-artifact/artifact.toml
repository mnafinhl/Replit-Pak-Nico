kind = "web"
previewPath = "/"
title = "Linux Distro Repository"
description = "A CachyOS-inspired Linux distribution repository with secure role-based access, searchable distro records, and admin CRUD workflows for maintaining images, metadata, and lifecycle status."
version = "1.0.0"
id = "artifacts/linux-distro-repository"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21235

[services.development]
run = "pnpm --filter @workspace/linux-distro-repository run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/linux-distro-repository", "run", "build" ]
serve = "static"
publicDir = "artifacts/linux-distro-repository/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21235"
BASE_PATH = "/"
